steps:
  - name: gcr.io/cloud-builders/docker
    dir: model
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/alzico-backend
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - gcr.io/$PROJECT_ID/alzico-backend

  - name: gcr.io/cloud-builders/gcloud
    args:
      - run
      - deploy
      - alzico-backend
      - --image=gcr.io/$PROJECT_ID/alzico-backend
      - --region=us-central1
      - --platform=managed
      - --allow-unauthenticated

images:
  - gcr.io/$PROJECT_ID/alzico-backend

options:
  logging: CLOUD_LOGGING_ONLY
